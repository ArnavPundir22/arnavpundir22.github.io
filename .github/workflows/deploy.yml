name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main, copilot/rebuild-portfolio-mern]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy built files to root
        run: |
          rm -rf assets
          cp -r dist/assets ./assets
          cp dist/index.html ./index.html
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ index.html .nojekyll
          git diff --cached --quiet || git commit -m "chore: deploy built portfolio [skip ci]"
          git push
