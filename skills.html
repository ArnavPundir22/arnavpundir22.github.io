<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Skills - Arnav</title>
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
  <link rel="stylesheet" href="style.css" />
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
<style>
/* Reset and base */
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: #0d1117;
  color: white;
}

/* Navigation */
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 50px;
  position: relative;
  z-index: 100;
}

nav h1 {
  font-size: 2rem;
  color: white;
}

#nav-links li a.active {
  color: #4acfee;
  position: relative;
}

#nav-links li a.active::after {
  content: '';
  position: absolute;
  bottom: -5px;
  left: 0;
  height: 2px;
  width: 100%;
  background: #4acfee;
  border-radius: 2px;
}

#nav-links {
  list-style: none;
  display: flex;
  gap: 2rem;
}

#nav-links li a {
  color: white;
  text-decoration: none;
  font-size: 1.2rem;
  position: relative;
  transition: color 0.3s ease;
}

#nav-links li a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -5px;
  width: 0%;
  height: 2px;
  background-color: #4acfee;
  transition: width 0.3s ease-in-out;
}

#nav-links li a:hover::after {
  width: 100%;
}

#nav-links li a:hover {
  color: #4acfee;
}

.hamburger {
  display: none;
  font-size: 2.5rem;
  color: white;
  cursor: pointer;
  z-index: 1001;
}

/* Mobile */
@media screen and (max-width: 768px) {
  .hamburger {
    display: block;
  }

  #nav-links {
    position: absolute;
    top: 80px;
    right: 30px;
    background-color: rgba(0, 0, 0, 0.95);
    flex-direction: column;
    align-items: center;
    padding: 20px;
    border-radius: 10px;
    display: none;
  }

  #nav-links.show {
    display: flex;
  }

  #nav-links li {
    margin: 10px 0;
  }
}

/* Background video */
.back-vid {
  position: fixed;
  right: 0;
  bottom: 0;
  min-width: 100%;
  min-height: 100%;
  z-index: -1;
  object-fit: cover;
}

/* Skills section */
.skills-section {
  padding: 100px 50px;
  text-align: center;
}

.section-title {
  font-size: 2.5rem;
  margin-bottom: 40px;
  color: #4acfee;
}

/* Filter buttons */
.filter-buttons {
  margin-bottom: 30px;
}

.filter-btn {
  background-color: transparent;
  border: 2px solid #4acfee;
  color: white;
  padding: 10px 20px;
  margin: 5px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}

.filter-btn.active,
.filter-btn:hover {
  background-color: #4acfee;
  color: black;
}

/* Skills grid */
.skills-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
}

.skill-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid #4acfee;
  border-radius: 10px;
  color: white;
  font-size: 1rem;
  cursor: pointer;
  transition: transform 0.3s ease;
}

.skill-card:hover {
  transform: scale(1.05);
}

/* Elegant glassmorphism tooltip */
.skill-card::after {
  content: attr(data-info);
  position: absolute;
  bottom: 130%;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #ffffff;
  padding: 10px 15px;
  border-radius: 10px;
  font-size: 0.9rem;
  text-align: center;
  width: 220px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease, bottom 0.3s ease;
  z-index: 10;
}

.skill-card:hover::after {
  opacity: 1;
  bottom: 150%;
}
</style>

<video autoplay loop muted plays-inline class="back-vid">
  <source src="images/galaxy.mp4" type="video/mp4"> 
</video>

<section class="main-section">
  <nav>
    <h1 data-aos="zoom-in" data-aos-duration="1000"><span style="color: #4acfee;">Ar</span>nav.</h1>
    <div class="hamburger" onclick="toggleMenu()">
      <i class='bx bx-menu'></i>
    </div>
    <ul id="nav-links">
      <li><a href="index.html">Home </a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="project.html">Projects</a></li>
      <li><a class="active" href="#">Skills</a></li>
      <li><a href="contact.html">Contact Me</a></li>
    </ul>
  </nav>

  <section id="skills" class="skills-section" data-aos="fade-up" data-aos-duration="1000">
    <h2 class="section-title">My Skills</h2>

    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="language">Languages</button>
      <button class="filter-btn" data-filter="framework">Frameworks</button>
      <button class="filter-btn" data-filter="domain">Domains</button>
    </div>

    <div class="skills-grid">
      <!-- Languages -->
      <div class="skill-card language" data-info="Used in: Face Recognition System, Emotion Music App, System Automation."><i class='bx bxl-python'></i>Python</div>
      <div class="skill-card language" data-info="Used in: Academic Projects, Android Development Basics."><i class='bx bxl-java'></i>Java</div>
      <div class="skill-card language" data-info="Used in: C++ Face Detection Project (LinkedIn)."><i class='bx bxl-c-plus-plus'></i>C++</div>
      <div class="skill-card language" data-info="Used in: Portfolio Website, Safety Web App."><i class='bx bxl-javascript'></i>JavaScript</div>
      <div class="skill-card language" data-info="Used in: Portfolio, Web UI for Projects."><i class='bx bx-code-alt'></i>HTML & CSS</div>


      <!-- Frameworks -->
      <div class="skill-card framework" data-info="Used in: GUI for AI Assistant 'Devin', Emotion Music App."><i class='bx bx-desktop'></i>PyQt5</div>
<div class="skill-card framework" data-info="Used in: Face Recognition, AntiSpoofing, Gesture Recognition."><i class='bx bx-video-recording'></i>OpenCV</div>
<div class="skill-card framework" data-info="Used in: Emotion Detection and AntiSpoofing System."><i class='bx bxl-tux'></i>TensorFlow</div>
<div class="skill-card framework" data-info="Used in: Blink-based Verification for Attendance System."><i class='bx bx-bot'></i>cvzone</div>
<div class="skill-card framework" data-info="Used in: Object Detection in AntiSpoofing System."><i class='bx bxs-analyse'></i>YOLOv8</div>
<div class="skill-card framework" data-info="Used in: Face Landmark Detection for Blink Verification."><i class='bx bx-face'></i>dlib</div>

      <!-- Domains -->
      <div class="skill-card domain" data-info="Applied in: Face Recognition, Emotion Detection, AntiSpoofing Projects."><i class='bx bxs-brain'></i>AI & Computer Vision</div>
<div class="skill-card domain" data-info="Applied in: AI Assistant 'Devin', Attendance System GUI, Music Player."><i class='bx bx-laptop'></i>Desktop Applications</div>
<div class="skill-card domain" data-info="Applied in: Voice-Controlled Assistant 'Devin' (volume, brightness, media)."><i class='bx bx-cog'></i>System Automation</div>
</div>
  </section>
</section>

<!-- Scripts -->
<script src="https://unpkg.com/aos@next/dist/aos.js"></script>
<script>AOS.init();</script>

<script>
  function toggleMenu() {
    const navLinks = document.getElementById('nav-links');
    navLinks.classList.toggle('show');
  }

  const filterBtns = document.querySelectorAll('.filter-btn');
  const cards = document.querySelectorAll('.skill-card');

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filter = btn.getAttribute('data-filter');

      cards.forEach(card => {
        card.style.display =
          filter === 'all' || card.classList.contains(filter) ? 'flex' : 'none';
      });
    });
  });
</script>

</body>
</html>
