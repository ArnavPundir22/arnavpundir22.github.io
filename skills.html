<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Skills - Arnav</title>
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
  <link rel="stylesheet" href="style.css" />
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
<style>/* Base styles */
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 50px;
  position: relative;
  z-index: 100;
}

nav h1 {
  font-size: 2rem;
  color: white;
}
#nav-links li a.active {
  color: #4acfee; /* Highlight color */
  position: relative;
}

#nav-links li a.active::after {
  content: '';
  position: absolute;
  bottom: -5px;
  left: 0;
  height: 2px;
  width: 100%;
  background: #4acfee;
  border-radius: 2px;
}
#nav-links li a {
  position: relative;
  transition: color 0.3s ease;
}

#nav-links li a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -5px;
  width: 0%;
  height: 2px;
  background-color: #4acfee;
  transition: width 0.3s ease-in-out;
}

#nav-links li a:hover::after {
  width: 100%;
}

#nav-links li a:hover {
  color: #4acfee;
}


/* Navigation links */
#nav-links {
  list-style: none;
  display: flex;
  gap: 2rem;
}

#nav-links li a {
  color: white;
  text-decoration: none;
  font-size: 1.2rem;
}

.hamburger {
  display: none;
  font-size: 2.5rem;
  color: white;
  cursor: pointer;
  z-index: 1001;
}

/* Mobile view */
@media screen and (max-width: 768px) {
  .hamburger {
    display: block;
  }

  #nav-links {
    position: absolute;
    top: 80px;
    right: 30px;
    background-color: rgba(0, 0, 0, 0.95);
    flex-direction: column;
    align-items: center;
    padding: 20px;
    border-radius: 10px;
    display: none;
  }

  #nav-links.show {
    display: flex;
  }

  #nav-links li {
    margin: 10px 0;
  }
}
</style>
  <video autoplay loop muted plays-inline class="back-vid">
    <source src="images/galaxy.mp4" type="video/mp4"> 
  </video>

  <section class="main-section">
    <nav>
  <h1 data-aos="zoom-in" data-aos-duration="1000"><span style="color: #4acfee;">Ar</span>nav.</h1>
  <div class="hamburger" onclick="toggleMenu()">
    <i class='bx bx-menu'></i>
  </div>
  <ul id="nav-links">
    <li><a href="index.html">Home </a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="project.html">Projects</a></li>
    <li><a class="active"href="#">Skills</a></li>
    <li><a href="contact.html">Contact Me</a></li>
  </ul>
</nav>

    <section id="skills" class="skills-section" data-aos="fade-up" data-aos-duration="1000">
      <h2 class="section-title">My Skills</h2>

      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="language">Languages</button>
        <button class="filter-btn" data-filter="framework">Frameworks</button>
        <button class="filter-btn" data-filter="domain">Domains</button>
      </div>

      <div class="skills-grid">
        <div class="skill-card language"><i class='bx bxl-python'></i>Python</div>
        <div class="skill-card language"><i class='bx bxl-java'></i>Java</div>
        <div class="skill-card language"><i class='bx bxl-c-plus-plus'></i>C++</div>
        <div class="skill-card language"><i class='bx bxl-javascript'></i>JavaScript</div>
        <div class="skill-card language"><i class='bx bx-code-alt'></i>HTML & CSS</div>

        <div class="skill-card framework"><i class='bx bx-desktop'></i>PyQt5</div>
        <div class="skill-card framework"><i class='bx bx-video-recording'></i>OpenCV</div>
        <div class="skill-card framework"><i class='bx bxl-tux'></i>TensorFlow</div>
        <div class="skill-card framework"><i class='bx bx-bot'></i>cvzone</div>
        <div class="skill-card framework"><i class='bx bxs-analyse'></i>YOLOv8</div>
        <div class="skill-card framework"><i class='bx bx-face'></i>dlib</div>

        <div class="skill-card domain"><i class='bx bxs-brain'></i>AI & Computer Vision</div>
        <div class="skill-card domain"><i class='bx bx-laptop'></i>Desktop Applications</div>
        <div class="skill-card domain"><i class='bx bx-cog'></i>System Automation</div>
      </div>
    </section>
  </section>

  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>AOS.init();</script>

  <script>
    const filterBtns = document.querySelectorAll('.filter-btn');
    const cards = document.querySelectorAll('.skill-card');

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.getAttribute('data-filter');

        cards.forEach(card => {
          card.style.display =
            filter === 'all' || card.classList.contains(filter) ? 'flex' : 'none';
        });
      });
    });
  </script>
    <script>
  function toggleMenu() {
    const navLinks = document.getElementById('nav-links');
    navLinks.classList.toggle('show');
  }
</script>

</body>
</html>
